name: Test ROM generator
on:
  push:
    paths:
      - 'rom_test.py'
      - 'tile_optimizer.py'
      - 'quantizer.py'
      - 'tests/**'
      - 'sms_quantizer.py'
      - 'sms_rom.py'
      - 'master-system/**'
      - '.github/workflows/test-rom.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy pillow
      - run: python -m unittest discover -s tests -v
