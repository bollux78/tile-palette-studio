name: Test ROM generator
on:
  push:
    paths:
      - 'rom_test.py'
      - 'tile_optimizer.py'
      - 'quantizer.py'
      - 'image_prepare.py'
      - 'app.js'
      - 'index.html'
      - 'tests/**'
      - 'sms_quantizer.py'
      - 'sms_rom.py'
      - 'sms_scroll*'
      - 'master-system/**'
      - '.github/workflows/test-rom.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy pillow z80 pyz80
      - run: pyz80 --obj=/tmp/sms-scroll.bin sms_scroll_loader.asm
      - run: python -c "import base64,pathlib; assert pathlib.Path('/tmp/sms-scroll.bin').read_bytes() == base64.b64decode(pathlib.Path('sms_scroll_loader.b64').read_text())"
      - run: python -m unittest discover -s tests -v
