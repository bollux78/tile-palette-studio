<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tile Palette Studio Web</title>
<style>body{background:#10151f;color:#e9eef8;font:15px system-ui;margin:0}header{padding:20px;background:#1c2637}main{display:grid;grid-template-columns:300px 1fr;gap:18px;padding:18px}aside,section{background:#1b2535;border-radius:12px;padding:18px}label{display:block;margin:12px 0 5px}input,select,button{max-width:100%;box-sizing:border-box}input[type=number],select{width:100%;padding:8px;background:#111a28;color:white;border:1px solid #53617a;border-radius:6px}button{margin:8px 4px 0 0;padding:10px;border:0;border-radius:6px;background:#5e9cfa;color:#10151f;font-weight:bold;cursor:pointer}button:disabled{opacity:.4}.preview{display:flex;gap:12px;flex-wrap:wrap}.preview>div{flex:1;min-width:200px}canvas{max-width:100%;image-rendering:pixelated;background:#000}.hint{color:#a9b8cc;font-size:13px}#status{margin-top:15px}@media(max-width:750px){main{grid-template-columns:1fr}}</style></head>
<body><header><h2>Tile Palette Studio <small>Web — versão inicial</small></h2><span class="hint">Importação local PNG, BMP, GIF, WebP e JPEG · nenhum upload para servidor</span></header>
<main><aside><label>Imagem</label><input id="file" type="file" accept=".png,.bmp,.gif,.webp,.jpg,.jpeg,image/*"><label>Largura</label><input id="w" type="number" value="320" min="8" max="2048"><label>Altura</label><input id="h" type="number" value="224" min="8" max="2048"><label>Cores por paleta</label><input id="colors" type="number" value="16" min="2" max="16"><label>Número de paletas</label><input id="palettes" type="number" value="4" min="1" max="4"><label>Dithering</label><select id="dither"><option value="off">Desligado</option><option value="bayer2">Bayer 2×2</option><option value="bayer4" selected>Bayer 4×4</option><option value="bayer8">Bayer 8×8</option><option value="vertical2">Vertical 2</option><option value="vertical4">Vertical 4</option></select><label>Intensidade</label><input id="strength" type="range" min="0" max="1" step=".01" value=".38"><div><button id="process" disabled>Paletizar</button><button id="save" disabled>Baixar PNG</button></div><p class="hint">O arquivo original nunca é modificado. Exportação SGDK e algoritmo Python completo serão integrados na próxima etapa.</p></aside>
<section><div class="preview"><div><h3>Original</h3><canvas id="original"></canvas></div><div><h3>Paletizado</h3><canvas id="output"></canvas></div></div><p id="status">Selecione uma imagem para começar.</p></section></main>
<script>
const $=id=>document.getElementById(id);let image=null,filename='imagem';
$('file').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;filename=file.name.replace(/\.[^.]+$/,'');try{const bitmap=await createImageBitmap(file);image=bitmap;$('w').value=bitmap.width;$('h').value=bitmap.height;$('process').disabled=false;$('status').textContent='Imagem carregada: '+file.name;drawOriginal()}catch(err){$('status').textContent='Não foi possível abrir a imagem: '+err.message}});
function drawOriginal(){if(!image)return;const w=Math.max(1,Math.min(2048,+$('w').value||320)),h=Math.max(1,Math.min(2048,+$('h').value||224));const c=$('original');c.width=w;c.height=h;c.getContext('2d').drawImage(image,0,0,w,h)}
const bayer2=[[0,2],[3,1]],bayer4=[[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]],bayer8=Array.from({length:8},(_,y)=>Array.from({length:8},(_,x)=>4*bayer4[y%4][x%4]+bayer2[Math.floor(y/4)][Math.floor(x/4)]));
function md(v){return Math.max(0,Math.min(7,Math.round(v*7/255)))*255/7}
$('process').onclick=()=>{drawOriginal();const c=$('original'),w=c.width,h=c.height,src=c.getContext('2d').getImageData(0,0,w,h),dst=new ImageData(w,h);const mode=$('dither').value,s=+$('strength').value,levels=Math.max(2,Math.min(16,+$('colors').value||16)),palettes=Math.max(1,Math.min(4,+$('palettes').value||4));const count=levels*palettes;const histogram=new Map();for(let i=0;i<src.data.length;i+=4){const r=Math.round(md(src.data[i])*7/255),g=Math.round(md(src.data[i+1])*7/255),b=Math.round(md(src.data[i+2])*7/255),key=(r<<6)|(g<<3)|b;histogram.set(key,(histogram.get(key)||0)+1)}const palette=[...histogram].sort((a,b)=>b[1]-a[1]).slice(0,count).map(([key])=>[(key>>6)*255/7,((key>>3)&7)*255/7,(key&7)*255/7]);if(!palette.length)return;const mat=mode==='bayer2'?bayer2:mode==='bayer8'?bayer8:bayer4;const n=mat.length;for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=(y*w+x)*4;let d=0;if(mode.startsWith('bayer'))d=((mat[y%n][x%n]+.5)/(n*n)-.5)*64*s;else if(mode==='vertical2')d=((x%2)-.5)*64*s;else if(mode==='vertical4')d=([-.375,.125,-.125,.375][x%4])*64*s;let best=palette[0],dist=Infinity;for(const p of palette){const dr=src.data[i]+d-p[0],dg=src.data[i+1]+d-p[1],db=src.data[i+2]+d-p[2],score=dr*dr+dg*dg+db*db;if(score<dist){dist=score;best=p}}dst.data[i]=best[0];dst.data[i+1]=best[1];dst.data[i+2]=best[2];dst.data[i+3]=255}const out=$('output');out.width=w;out.height=h;out.getContext('2d').putImageData(dst,0,0);$('save').disabled=false;$('status').textContent='Prévia gerada ('+palette.length+' cores globais). Esta é uma implementação inicial, ainda não equivalente à quantização por tile do aplicativo Python.'};
$('save').onclick=()=>{$('output').toBlob(blob=>{if(!blob)return;const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename+'_pal.png';a.click();setTimeout(()=>URL.revokeObjectURL(url),5000)},'image/png')};
$('w').addEventListener('change',drawOriginal);$('h').addEventListener('change',drawOriginal);
</script></body></html>
